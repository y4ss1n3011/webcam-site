<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webcam Live</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: black;
}

video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>

<script>
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
    document.getElementById("video").srcObject = stream;
})
.catch(err => {
    alert("Webcam non disponibile o permesso negato");
});
</script>

</body>
</html>
