<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webcam Live</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: black;
}

/* VIDEO CAMERA */
video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
}

/* TESTO LED */
#ledText {
    position: fixed;
    bottom: 30px;
    right: 10px;
    font-size: 18px;
    font-weight: bold;
    font-family: Arial;
    animation: led 1s infinite;
    z-index: 10;
}

/* ANIMAZIONE LED */
@keyframes led {
    0% { color: red; }
    25% { color: orange; }
    50% { color: yellow; }
    75% { color: lime; }
    100% { color: red; }
}

/* INFO DISPOSITIVO */
#deviceInfo {
    position: fixed;
    bottom: 10px;
    right: 10px;
    font-size: 12px;
    color: white;
    opacity: 0.8;
    font-family: Arial;
    z-index: 10;
}
</style>
</head>

<body>

<!-- TESTI SOPRA VIDEO -->
<div id="ledText">Jeffrey Epstein</div>
<div id="deviceInfo"></div>

<!-- WEBCAM -->
<video id="video" autoplay playsinline></video>

<script>
/* AVVIO WEBCAM */
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
    document.getElementById("video").srcObject = stream;
})
.catch(err => {
    alert("Webcam non disponibile o permesso negato");
});

/* INFO DISPOSITIVO */
document.getElementById("deviceInfo").innerText =
navigator.userAgent;

/* TESTO LED (puoi cambiarlo qui) */
document.getElementById("ledText").innerText =
"MUSS8 X SEMPRE";
</script>

</body>
</html>
